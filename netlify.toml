# Domain setup (Netlify UI → Domain management):
# 1. Add prolinewheelandtire.com and set www.prolinewheelandtire.com as primary
# 2. Keep mobiletirepro.net attached to this site (redirect rules live in public/_redirects)
# 3. Point DNS at your registrar per Netlify's instructions for both domains

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
